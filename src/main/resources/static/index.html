<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
</head>
<body>
    <h1>Teste com a API</h1>

    <h2>GET METHOD</h2>
    <button id="btnAtualizar" onclick="carregarTabela()">Buscar agendamentos</button>

    <table>
        <thead>
            <tr>
                <th>Id</th>
                <th>Nome</th>
                <th>Data</th>
                <th>Hora</th>
                <th>Descricao</th>
            </tr>
        </thead>
        <tbody id="corpo"></tbody>
    </table>

    <h2>POST METHOD</h2>
    <form id="formCadastro">
        <label for="nome">Nome:</label><br>
        <input type="text" name="nome" id="nome" required>
        <br><br>
        <label for="data">Data:</label><br>
        <input type="date" name="data" id="data" required>
        <br><br>
        <label for="hora">Hora:</label><br>
        <input type="time" name="hora" id="hora" required>
        <br>
        <label for="descricao">Descricao:</label><br>
        <input type="text" name="descricao" id="descricao" required>
        <br><br>
        <label for="doctorId">Doutor:</label> <br>
        <input type="number" name="doctorId" id="doctorId" required>
        <br><br>
        <button type="submit" id="btnCadastro">Cadastrar Agendamento</button>
        <br><br>
    </form>

    <dialog class="modal" id="editDialog">
        <p id="editTransferId"></p>

        <p>Edit Element <button onclick="document.getElementById('editDialog').close()">X</button></p>


    </dialog>

    <dialog class="modal" id="deleteDialog">
        <p id="delTransferId"></p>

        <p>Tem certeza?</p>

        <button id="confirmDelete">Confirm</button>
        <button onclick="document.getElementById('deleteDialog').close()">Cancel</button>


    </dialog>

    <script src="js/script.js"></script>
</body>
</html>
