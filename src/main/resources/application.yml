spring:
  application:
    name: sistema-agendamentos

  web:
    error:
      include-stacktrace: never

  datasource:
    url: jdbc:mysql://localhost:3306/agendamentos?userSSL=false&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update

  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

app:
  doctor-provisioning-token: ${DOCTOR_PROVISIONING_TOKEN:}
